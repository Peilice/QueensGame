<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Queens 皇后解謎</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="levels-view" hidden>
    <header class="top">
      <h1>Queens</h1>
    </header>
    <div id="level-packs"></div>
  </main>

  <main id="game-view" hidden>
    <header class="top">
      <button type="button" id="back" class="btn ghost" aria-label="回關卡列表">‹ 關卡</button>
      <h1 id="level-title"></h1>
      <span class="spacer"></span>
    </header>
    <div class="play">
      <div class="sheet">
        <div id="board" class="board"></div>
      </div>
      <div id="controls" class="controls">
        <button type="button" id="undo" class="btn">上一步</button>
        <button type="button" id="reset" class="btn">重來</button>
      </div>
      <section id="win" class="win" hidden aria-labelledby="win-title">
        <h2 id="win-title">過關！</h2>
        <div class="win-actions">
          <button type="button" id="win-next" class="btn primary">下一關</button>
          <button type="button" id="win-list" class="btn">回關卡列表</button>
        </div>
        <div id="seal" class="seal" hidden aria-hidden="true"><span>過關</span></div>
      </section>
      <details id="rules" class="rules">
        <summary>
          規則
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </summary>
        <div class="rules-body">
          <p>每一列、每一行、每個色塊<strong>恰好一個</strong>皇后。</p>
          <p>任兩個皇后<strong>不可相鄰</strong>，斜角也不行。</p>
          <p class="hint">點一下標 ✕，再點一下放皇后，再點一下清空。按住拖曳可連續標 ✕。</p>
        </div>
      </details>
    </div>
  </main>
</body>
</html>
